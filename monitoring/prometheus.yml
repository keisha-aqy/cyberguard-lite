global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitor Windows Host
  - job_name: "windows"
    static_configs:
      - targets: ["host.docker.internal:9182"]
